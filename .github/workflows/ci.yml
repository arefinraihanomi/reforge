name: CI

on:
  push:
    branches: [main, fixed]
  pull_request:
    branches: [main, fixed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Static Analysis
  # ---------------------------------------------------------------------------
  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create stub .env for analysis
        run: |
          mkdir -p assets
          echo "SUPABASE_URL=https://placeholder.supabase.co" > assets/.env
          echo "SUPABASE_ANON_KEY=placeholder_anon_key" >> assets/.env

      - name: Run flutter analyze
        run: flutter analyze --fatal-infos

  # ---------------------------------------------------------------------------
  # Job 2: Unit & Widget Tests
  # ---------------------------------------------------------------------------
  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create stub .env for tests
        run: |
          mkdir -p assets
          echo "SUPABASE_URL=https://placeholder.supabase.co" > assets/.env
          echo "SUPABASE_ANON_KEY=placeholder_anon_key" >> assets/.env

      - name: Run unit & widget tests
        run: flutter test --coverage

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Job 3: Build Verification (Android)
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Verification (Android)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create stub .env for build
        run: |
          mkdir -p assets
          echo "SUPABASE_URL=https://placeholder.supabase.co" > assets/.env
          echo "SUPABASE_ANON_KEY=placeholder_anon_key" >> assets/.env

      - name: Build APK (debug)
        run: flutter build apk --debug
